; discord: shows "Playing sc-offline" on your Discord profile while the game runs: the version this
; host reports, where you are and the ship you are aboard. Talks only to the Discord app on this PC
; (its local pipe); nothing goes over the network. On by default; turn it off in the launcher's
; Plugins page (it creates an empty file named "disabled" here). Format: docs/plugin-ini.md in the sco SDK.
id = discord
name = Discord 状态
version = 1.0.0
author = sc-offline
api = 1.1
kind = native
entry = discord.dll

[settings]
show_location = bool default true label "显示当前位置" help "你所在的卫星、行星或空间站"
show_ship     = bool default true label "显示飞船" help "你当前乘坐的飞船"
show_buttons  = bool default true label "显示按钮" help "在个人资料中显示加入 Discord 和获取 sc-offline 按钮"
