# sc-offline 启动器设置（简体中文）。每行格式为 key = value，# 开头为注释。
# 仅修改右侧配置值，配置键名、on/off 和游戏内部名称请保留英文。

# 星际公民目录。不设置时依次读取 RSI 启动器记录、搜索常见目录和磁盘，最后打开目录选择框。
# 以下两种路径都可用：
#   game = D:\Games\Roberts Space Industries
#   game = D:\Games\Roberts Space Industries\StarCitizen\LIVE
# game =

# 游戏频道：LIVE、PTU、EPTU 等。
channel = LIVE

# 启动地图。PU_All 加载所有星系，“旅行”页面可访问 Pyro 和 Nyx。
# 旧版 ChrisWareOffline DLL 仅支持 PU。
boot_map = PU_All

# 初始位置。留空使用游戏默认出生点（PU 为 Orison，PU_All 为 Pyro 空间站）。
# start = Daymar：出生约 10 秒后，进入 Daymar 上方由 start_ship 指定的飞船。
# start_ship 仅在 start = Daymar 时生效。
start_ship = DRAK_Cutlass_Black
start =
# aUEC 余额在 data\wallet.txt 中设置，详见 docs/features.md。

# 从 data\plugins\<id>\ 加载插件。插件在游戏内执行代码，请仅安装可信插件。
# mod.log 会列出发现的插件。发行包包含 NPC、检查器、Discord 状态和创造模式插件。
# 创造模式默认关闭，可在启动器“插件”页面开启。可选 on 或 off。
plugins = on

# 游戏内菜单（M）的“联机”页面，支持局域网或 VPN 中同样使用 sc-offline 的朋友。
# 点击“创建房间”或“加入”前不会连接。block_network = on 时仍允许局域网 UDP 通讯。
multiplayer = on
# VPN 的额外允许网段：逗号分隔的 IPv4 CIDR，/8 或更小范围，最多 8 个。
# Tailscale 示例：100.64.0.0/10。请仅允许实际使用的网段；留空表示仅局域网。
multiplayer_allow =

# ASOP 飞船终端、个人机库、升降平台和 ATC 呼叫。存放的飞船仅在本次游戏内保留。
asop = on
# 终端飞船列表：ships = data\ships.txt 中的所有飞船；game = 游戏原生列表（离线查询通常为空）。
asop_fleet_list = ships
# 自然采矿：生成周围生态区域中的可采集矿石。实验性功能，默认关闭。
# mining_debug = on 会将计数器写入 mod.log。
mining = off
mining_debug = off

# 以下系统更改在游玩期间生效，游戏退出后自动还原。每次启动请求一次管理员授权。
# block_network：通过防火墙阻止游戏、RSI 启动器和 CrashHandler 联网；sc-offline 自身可检查更新。
block_network = on
# eac_hosts：添加 hosts 条目，防止 RSI 启动器再次下载 Easy Anti-Cheat。
eac_hosts = on
# eac_rename：将 EasyAntiCheat_EOS.exe 重命名为 .bak，防止其启动。
eac_rename = on

# 游戏退出后列出本次日志，经两次确认后删除。不会修改旧日志。可选 ask 或 off。
clean_logs = ask
# 崩溃后询问是否生成脱敏日志压缩包，保存在 data\crash-reports；不会自动发送。
crash_reports = on

# 检查本汉化 fork 的 GitHub Releases，安装前询问，并保留存档和此配置文件。
# fork 尚未发布版本时会提示未找到发布版本。可选 on 或 off。
check_updates = on
# stable = 仅正式版；prerelease = 也检查测试版。
update_channel = stable
