name: 简体中文 Windows 编译

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'launcher/**'
      - 'plugins/**'
      - 'data/**'
      - 'CMakeLists.txt'
      - 'README.zh-CN.md'
      - '.github/workflows/build-chs.yml'

permissions:
  contents: read

concurrency:
  group: chs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: 配置并编译启动器和模组
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 18 2026" -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel --target dinput8 sc-offline sc-offline-creative sc-offline-discord
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 下载官方发布的插件 SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download sdk-v2.0.0 -R scubamount/sco-core -p 'sco-sdk-2.0.0.zip' -p SHA256SUMS -D "$env:RUNNER_TEMP/sdk-assets"

      - name: 编译并验证外部 NPC 和检查器插件
        shell: pwsh
        run: |
          python tools/check_npc_sdk.py --archive "$env:RUNNER_TEMP/sdk-assets/sco-sdk-2.0.0.zip" --sums "$env:RUNNER_TEMP/sdk-assets/SHA256SUMS" --work "$env:RUNNER_TEMP/npc-proof"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_inspector_sdk.py --archive "$env:RUNNER_TEMP/sdk-assets/sco-sdk-2.0.0.zip" --sums "$env:RUNNER_TEMP/sdk-assets/SHA256SUMS" --work "$env:RUNNER_TEMP/inspector-proof"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 打包完整便携目录（包含中文字体）
        shell: python
        run: |
          import os, pathlib, re, shutil, subprocess
          root = pathlib.Path.cwd()
          package = root / 'stage' / 'sc-offline-chs'
          package.mkdir(parents=True)
          for name in ('sc-offline.exe', 'dinput8.dll'):
              shutil.copy2(root / 'build/bin/Release' / name, package / name)
          shutil.copytree(root / 'data', package / 'data')
          shutil.copytree(root / 'docs', package / 'docs')
          for name in ('sc-offline.ini', 'sc-offline.sh'):
              shutil.copy2(root / 'launcher' / name, package / name)
          for name in ('README.md', 'README.zh-CN.md', 'CHANGELOG.md', 'LICENSE'):
              shutil.copy2(root / name, package / name)
          for name in ('creative', 'discord'):
              shutil.copy2(root / 'build/data/plugins' / name / (name + '.dll'), package / 'data/plugins' / name / (name + '.dll'))
          for name in ('npc', 'inspector'):
              source = pathlib.Path(os.environ['RUNNER_TEMP']) / (name + '-proof') / 'stage/data/plugins' / name
              shutil.copytree(source, package / 'data/plugins' / name)
          assert (package / 'data/fonts/NotoSansSC-Regular.ttf').stat().st_size > 1000000
          version = re.search(r'^#define\s+SCO_VERSION\s+"([^"]+)"', (root / 'src/version.h').read_text(encoding='utf-8'), re.M).group(1)
          subprocess.run(['python', 'tools/release-manifest.py', 'write', str(package), '--tag', 'v' + version, '--commit', os.environ['GITHUB_SHA'], '--version-h', 'src/version.h'], check=True)
          subprocess.run(['python', 'tools/release-manifest.py', 'check', str(package)], check=True)

      - name: 下载此产物即可获得完整汉化程序
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sc-offline-chs-windows-x64
          path: stage/sc-offline-chs/
          if-no-files-found: error
          retention-days: 30
